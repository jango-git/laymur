<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laymur</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Examples of laymur, a constraint-based UI layout library for three.js"
    />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url(fonts/space-grotesk-400.woff2) format("woff2");
      }
      @font-face {
        font-family: "Ubuntu Sans Mono";
        src: url(fonts/ubuntu-sans-mono-500.woff2) format("woff2");
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.js",
          "gsap": "./vendor/gsap.js",
          "laymur": "./vendor/laymur.js",
          "laymur-animations": "./vendor/laymur-animations.js",
          "./src/kit.js": "./dist/kit.js",
          "./src/space.js": "./dist/space.js",
          "./src/style.js": "./dist/style.js",
          "./src/textures.js": "./dist/textures.js",
          "./dist/scenes/": "./src/scenes/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
